[project]
name = "fde-takehome"
version = "0.1.0"
description = "FDE take-home assessment: MCP server, MCP security gateway, LLM gateway PII redaction, rate-limiting model router"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "mcp==2.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mcp_server*", "mcp_gateway*", "llm_gateway*", "rate_limiter*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/etc. in argument defaults is the documented
# pattern, not the mutable-default-argument bug B008 otherwise flags.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]
